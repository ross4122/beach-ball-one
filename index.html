<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beach Ball Two</title>

    <!-- Include Roboto font from Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- Include Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
    />

    <!-- Include leaflet-locatecontrol CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.css"
    />

    <!-- FontAwesome Icons (if needed) -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Include Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>

    <style>
      /* Apply Roboto font to everything */
      body {
        font-family: "Roboto", sans-serif;
        margin: 0;
        height: 100%;
      }

      /* Force Roboto across Leaflet UI */
      .leaflet-container,
      .leaflet-container * {
        font-family: "Roboto", sans-serif;
      }

      #map {
        width: 100%;
        height: 100vh;
      }

      .checkbox-container {
        position: fixed;
        z-index: 999;
        top: 10px;
        right: 10px;
        background: white;
        padding: 10px;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      }

      input[type="checkbox"] {
        margin-right: 5px;
      }

      /* --- Leaflet divIcon marker styling --- */

      .bus-divicon {
        background: transparent !important;
        border: none !important;
      }

      /* This is the actual icon box Leaflet positions and clicks */
	  .bus-marker {
	  width: 52px;
	  height: 16px;
	  display: flex;
	  align-items: center;
	  justify-content: center;
	  gap: 4px;
	  pointer-events: none;
	  }

      /* Requirement badge (kept, even if unused) */
      .newicon,
      .bothreqicon,
      .r-reqicon,
      .k-reqicon {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        height: 15px;
        min-width: 32px;
        padding: 0 6px;

        border-radius: 6px;
        border: 1px solid #000;

        font-size: 10px;
        font-weight: 900;
        line-height: 1;
        color: #000;

        background: #fff;
      }

      .bothreqicon {
        background: linear-gradient(90deg, #ff93c2 50%, #a9ff84 50%);
      }

      .r-reqicon {
        background: #ff93c2;
      }

      .k-reqicon {
        background: #a9ff84;
      }

      /* Fleet label */
	  .fleetlabel {
	  display: inline-flex;
	  align-items: center;
	  justify-content: center;
	  pointer-events: auto;
	  
	  height: 11.5px;        /* was 16px */
	  padding: 1.5px 4px 0;  /* top 1px, left/right 4px, bottom 0 */
	  
	  border-radius: 6px;
	  border: 1px solid #000;
	  background: #fff;
	  
	  font-size: 10.5px;
	  font-weight: 900;
	  line-height: 1;
	  color: #000;
	  }

      /* Colour the fleet label based on requirement */
      .fleetlabel--r {
        background: #ff93c2;
      }

      .fleetlabel--k {
        background: #a9ff84;
      }

      .fleetlabel--rk {
        background: linear-gradient(90deg, #ff93c2 50%, #a9ff84 50%);
      }

      .fleetlabel--b {
        background: linear-gradient(90deg, #ff93c2 50%, #a9ff84 50%);
      }

      .fleetlabel--unknown {
        background: #d99262; /* peach */
        color: #000;
      }

      .fleetlabel--nis {
        color: #ff0000;
      }
    </style>
  </head>

  <body>
    <div class="checkbox-container">
      <label>
        <input type="checkbox" id="requirementsCheckbox" /> Requirements
      </label>
    </div>

    <div id="map"></div>

    <script src="lists/rReqFleetNumbers.js"></script>
    <script src="lists/kReqFleetNumbers.js"></script>
    <script src="lists/bothReqFleetNumbers.js"></script>
    <script src="app.js"></script>
  </body>
</html>
